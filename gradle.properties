org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# Home Assistant that hosts the ECOWORTHY battery integration the TV app reads.
haHost=homeassistant.local
haPort=8123
# Long-lived access token: HA profile -> Security -> Long-lived access tokens.
# Kept out of git: set haToken=… in the git-ignored local.properties instead.
# Entity-id prefix / friendly-name marker used to discover the battery sensors.
haEntityPrefix=sensor.eco_worthy_0b_
haBatteryMarker=ECO-WORTHY
